<style>
  :root{
    --green:#16a34a; --green-dark:#15803d; --green-soft:#e8f7ee;
    --ink:#1a2b1e; --muted:#5c6f60; --line:#dce8de; --bg:#f4faf5; --card:#ffffff;
    --amber:#f59e0b;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       background:var(--bg); color:var(--ink); padding-bottom:34px}
  button{font-family:inherit; cursor:pointer}
  a{color:var(--green-dark)}

  /* Bandeau fixe du haut */
  .topbar{position:sticky; top:0; z-index:50; background:var(--green); color:#fff;
    display:flex; align-items:center; gap:10px; padding:10px 14px;
    box-shadow:0 2px 10px rgba(0,0,0,.15)}
  .topbar img{width:34px; height:34px; border-radius:8px; background:#fff}
  .topbar .brand{font-size:21px; font-weight:800; letter-spacing:.2px; line-height:1}
  .topbar .period{font-size:11.5px; opacity:.92; margin-top:3px}
  .topbar .spacer{flex:1}
  .listbtn{background:#fff; color:var(--green-dark); border:none; border-radius:999px;
    font-size:15px; font-weight:700; padding:9px 14px; white-space:nowrap}
  .listbtn small{display:block; font-size:11px; font-weight:600; color:var(--muted); text-align:center}

  /* 3 étapes */
  .steps{display:flex; gap:8px; padding:12px 14px 2px}
  .step{flex:1; background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:9px 6px; text-align:center; font-size:12.5px; font-weight:600; color:var(--ink)}
  .step .n{display:inline-flex; width:20px; height:20px; border-radius:50%; background:var(--green);
    color:#fff; align-items:center; justify-content:center; font-size:12px; font-weight:800; margin-bottom:4px}

  /* Installation */
  .install{margin:12px 14px 0; background:#fff7e6; border:1px solid #f3ddab; border-radius:12px;
    padding:11px 13px; font-size:13.5px; display:none}
  .install.show{display:block}
  .install b{color:#92600a}
  .install .row{display:flex; gap:8px; margin-top:8px}
  .install button{border:none; border-radius:8px; padding:8px 12px; font-size:13.5px; font-weight:700}
  .install .go{background:var(--green); color:#fff}
  .install .no{background:transparent; color:var(--muted)}

  /* Recherche + filtres */
  .tools{padding:12px 14px 0}
  .search{width:100%; font-size:16px; padding:12px 14px; border:1.5px solid var(--line);
    border-radius:12px; background:#fff; outline:none}
  .search:focus{border-color:var(--green)}
  .chips{display:flex; gap:7px; overflow-x:auto; padding:11px 1px 3px; scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto; border:1.5px solid var(--line); background:#fff; color:var(--ink);
    border-radius:999px; padding:7px 13px; font-size:14px; font-weight:600}
  .chip.on{background:var(--green); border-color:var(--green); color:#fff}

  /* Sections magasin */
  .store{margin-top:18px}
  .store-head{display:flex; align-items:center; gap:10px; padding:0 14px}
  .store-head h2{font-size:19px; margin:0; font-weight:800}
  .flyer{margin-left:auto; text-decoration:none; background:var(--green-soft); color:var(--green-dark);
    border:1.5px solid var(--green); font-weight:700; font-size:13.5px; padding:7px 12px; border-radius:999px}
  .cards{display:grid; grid-template-columns:1fr 1fr; gap:9px; padding:11px 14px 0}
  @media (max-width:360px){ .cards{grid-template-columns:1fr} }
  .card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:11px 12px;
    display:flex; flex-direction:column; gap:7px; position:relative}
  .card .name{font-size:14.5px; font-weight:600; line-height:1.3}
  .card .price{font-size:19px; font-weight:800; color:var(--green-dark)}
  .badge{align-self:flex-start; background:var(--amber); color:#fff; font-size:11px; font-weight:800;
    border-radius:6px; padding:3px 7px; letter-spacing:.2px}
  .addbtn{margin-top:auto; border:none; border-radius:10px; padding:11px; font-size:15px; font-weight:700;
    background:var(--green); color:#fff; width:100%}
  .addbtn.added{background:var(--green-soft); color:var(--green-dark); border:1.5px solid var(--green)}
  .noresult{padding:26px 14px; text-align:center; color:var(--muted); font-size:15px; display:none}

  footer{margin:26px 14px 0; font-size:12.5px; color:var(--muted); text-align:center; line-height:1.55}

  .langbtn{background:rgba(255,255,255,.18); color:#fff; border:1.5px solid rgba(255,255,255,.65);
    border-radius:999px; font-size:13.5px; font-weight:800; padding:8px 11px}
  .kofi{display:none; margin:18px auto 4px; width:fit-content; background:#ff5e5b; color:#fff;
    text-decoration:none; font-weight:800; font-size:15px; padding:12px 20px; border-radius:999px}
  .kofi.show{display:block}

  /* Vue Ma liste */
  .listview{display:none}
  body.inlist .shopview{display:none}
  body.inlist .listview{display:block}
  .backbar{display:flex; align-items:center; gap:8px; padding:13px 14px 0}
  .backbtn{background:none; border:none; color:var(--green-dark); font-size:16.5px; font-weight:700; padding:6px 0}
  .listview h2.title{font-size:20px; margin:8px 14px 0}
  .group{margin-top:16px}
  .group-head{display:flex; align-items:center; gap:10px; padding:0 14px}
  .group-head h3{margin:0; font-size:16.5px}
  .items{background:#fff; border:1px solid var(--line); border-radius:14px; margin:9px 14px 0; overflow:hidden}
  .item{display:flex; align-items:center; gap:9px; padding:11px 12px; border-bottom:1px solid var(--line)}
  .item:last-child{border-bottom:none}
  .item .nm{flex:1; font-size:14.5px; font-weight:600; line-height:1.3}
  .item .nm .pr{display:block; font-size:13px; color:var(--green-dark); font-weight:700; margin-top:2px}
  .qty{display:flex; align-items:center; gap:6px}
  .qty button{width:30px; height:30px; border-radius:50%; border:1.5px solid var(--line);
    background:#fff; font-size:17px; font-weight:700; color:var(--ink); line-height:1}
  .qty .qv{min-width:16px; text-align:center; font-weight:700; font-size:14.5px}
  .buybtn{border:none; background:var(--green); color:#fff; font-weight:700; font-size:13.5px;
    border-radius:8px; padding:9px 11px}
  .buybtn.done{background:var(--green-soft); color:var(--green-dark)}
  .delbtn{border:none; background:none; color:#b0bcb2; font-size:19px; padding:4px}
  .grandtotal{margin:14px; background:var(--green); color:#fff; border-radius:12px;
    padding:13px 16px; font-size:17px; font-weight:800; display:flex; justify-content:space-between}
  .empty{margin:16px 14px; text-align:center; color:var(--muted); font-size:15px;
    background:#fff; border:1px dashed var(--line); border-radius:14px; padding:22px 14px}
  .spent{margin:12px 14px 0; font-size:14.5px; font-weight:700; color:var(--ink);
    display:flex; justify-content:space-between}
</style>

    back:"← Continuer de magasiner", tobuy:"À acheter", bought:"Achetés", total:"Total",
    spent:"Total dépensé", buy:"Acheté", putback:"Remettre", empty:"Ta liste est vide. Ajoute des aubaines pour commencer!",
    noresult:"Aucune aubaine ne correspond à ta recherche cette semaine.",
    foot1:"Prix tirés des circulaires officielles des enseignes.", foot2:"Zeluvia — les aubaines d'épicerie du Québec, Canada.",
    coffee:"☕ M'offrir un café" },
  en: { step1:"Pick your deals", step2:"Add to your list", step3:"Shop store by store",
    installT:"Install Zeluvia on your phone", installX:" — an icon on your home screen, just like a real app.",
    iosHelp:"Tap Safari's Share button, then “Add to Home Screen”.",
    install:"Install", later:"Later", search:"Search a food… (e.g. chicken)", all:"All",
    flyer:"Flyer", best:"Best price", add:"Add", added:"Added ✓", mylist:"My list",
    back:"← Keep shopping", tobuy:"To buy", bought:"Bought", total:"Total",
    spent:"Total spent", buy:"Bought", putback:"Put back", empty:"Your list is empty. Add some deals to get started!",
    noresult:"No deal matches your search this week.",
    foot1:"Prices from the stores' official flyers.", foot2:"Zeluvia — grocery deals from Québec, Canada.",
    coffee:"☕ Buy me a coffee" }
};
</script>
<script>
/* ===== État, langue, logique ===== */
let lang = localStorage.getItem("zeluvia-lang") || ((navigator.language || "fr").toLowerCase().startsWith("en") ? "en" : "fr");
let S = STR[lang];
let state = { list: {}, bought: [] };
try { const raw = localStorage.getItem("zeluvia-pwa-v1"); if (raw) state = JSON.parse(raw); } catch (e) {}
function save() { localStorage.setItem("zeluvia-pwa-v1", JSON.stringify(state)); }
const byId = {}; DATA.forEach(it => byId[it.id] = it);
const bestIds = new Set();
{ const best = {}; DATA.forEach(it => { if (it.k && (!best[it.k] || it.p < best[it.k].p)) best[it.k] = it; }); Object.values(best).forEach(it => bestIds.add(it.id)); }
function fmt(v) { return lang === "fr" ? v.toFixed(2).replace(".", ",") + " $" : "$" + v.toFixed(2); }
function nm(it) { return lang === "fr" ? it.n : it.ne; }
function dsp(it) { return lang === "fr" ? it.d : it.de; }
const $ = id => document.getElementById(id);
let filter = -1, query = "";

function renderChips() {
  const c = $("chips"); c.innerHTML = "";
  const mk = (label, val) => { const b = document.createElement("button"); b.className = "chip" + (filter === val ? " on" : ""); b.textContent = label; b.onclick = () => { filter = val; renderChips(); renderStores(); }; c.appendChild(b); };
  mk(S.all, -1); STORES.forEach((st, si) => mk(st.name, si));
}

function renderStores() {
  const main = $("stores"); main.innerHTML = "";
  let any = false;
  STORES.forEach((st, si) => {
    if (filter !== -1 && filter !== si) return;
    const items = DATA.filter(it => it.s === si && (!query || (it.n + " " + it.ne).toLowerCase().includes(query)));
    if (!items.length) return;
    any = true;
    const sec = document.createElement("section"); sec.className = "store";
    sec.innerHTML = `<div class="store-head"><h2>${st.name}</h2><a class="flyer" href="${st.flyer}" target="_blank" rel="noopener">${S.flyer} →</a></div>`;
    const grid = document.createElement("div"); grid.className = "cards";
    items.forEach(it => {
      const card = document.createElement("div"); card.className = "card";
      const inList = !!state.list[it.id];
      card.innerHTML = `${bestIds.has(it.id) ? `<span class="badge">${S.best}</span>` : ""}<div class="name">${nm(it)}</div><div class="price">${dsp(it)}</div>`;
      const b = document.createElement("button");
      b.className = "addbtn" + (inList ? " added" : "");
      b.textContent = inList ? S.added : S.add;
      b.onclick = () => { if (state.list[it.id]) delete state.list[it.id]; else state.list[it.id] = 1; save(); renderStores(); updateTop(); };
      card.appendChild(b); grid.appendChild(card);
    });
    sec.appendChild(grid); main.appendChild(sec);
  });
  $("noresult").style.display = any ? "none" : "block";
}

function totals() { let c = 0, t = 0; for (const id in state.list) { const q = state.list[id]; c += q; t += byId[id].p * q; } return { c, t }; }
function updateTop() { const r = totals(); $("listCount").textContent = r.c; $("listTotal").textContent = fmt(r.t); }

function renderList() {
  const body = $("listBody"); body.innerHTML = "";
  const ids = Object.keys(state.list);
  if (!ids.length && !state.bought.length) { body.innerHTML = `<div class="empty">${S.empty}</div>`; return; }
  if (ids.length) {
    const h = document.createElement("h2"); h.className = "title"; h.style.marginTop = "14px"; h.textContent = S.tobuy; body.appendChild(h);
    STORES.forEach((st, si) => {
      const items = ids.map(id => byId[id]).filter(it => it.s === si);
      if (!items.length) return;
      const g = document.createElement("div"); g.className = "group";
      g.innerHTML = `<div class="group-head"><h3>${st.name}</h3><a class="flyer" href="${st.flyer}" target="_blank" rel="noopener">${S.flyer} →</a></div>`;
      const box = document.createElement("div"); box.className = "items";
      items.forEach(it => {
        const q = state.list[it.id];
        const row = document.createElement("div"); row.className = "item";
        row.innerHTML = `<div class="nm">${nm(it)}<span class="pr">${dsp(it)}</span></div>`;
        const qty = document.createElement("div"); qty.className = "qty";
        const minus = document.createElement("button"); minus.textContent = "−";
        minus.onclick = () => { state.list[it.id]--; if (state.list[it.id] <= 0) delete state.list[it.id]; save(); renderList(); renderStores(); updateTop(); };
        const qv = document.createElement("span"); qv.className = "qv"; qv.textContent = q;
        const plus = document.createElement("button"); plus.textContent = "+";
        plus.onclick = () => { state.list[it.id]++; save(); renderList(); updateTop(); };
        qty.append(minus, qv, plus);
        const buy = document.createElement("button"); buy.className = "buybtn"; buy.textContent = S.buy;
        buy.onclick = () => { state.bought.unshift({ id: it.id, price: it.p, qty: q }); delete state.list[it.id]; save(); renderList(); renderStores(); updateTop(); };
        const del = document.createElement("button"); del.className = "delbtn"; del.textContent = "✕";
        del.onclick = () => { delete state.list[it.id]; save(); renderList(); renderStores(); updateTop(); };
        row.append(qty, buy, del); box.appendChild(row);
      });
      g.appendChild(box); body.appendChild(g);
    });
    const gt = document.createElement("div"); gt.className = "grandtotal";
    gt.innerHTML = `<span>${S.total}</span><span>${fmt(totals().t)}</span>`; body.appendChild(gt);
  }
  if (state.bought.length) {
    const h = document.createElement("h2"); h.className = "title"; h.style.marginTop = "20px"; h.textContent = S.bought; body.appendChild(h);
    const box = document.createElement("div"); box.className = "items";
    state.bought.forEach((b, bi) => {
      const it = byId[b.id]; if (!it) return;
      const row = document.createElement("div"); row.className = "item";
      row.innerHTML = `<div class="nm">${nm(it)} — ${STORES[it.s].name}${b.qty > 1 ? " ×" + b.qty : ""}<span class="pr">${fmt(b.price * b.qty)}</span></div>`;
      const back = document.createElement("button"); back.className = "buybtn done"; back.textContent = S.putback;
      back.onclick = () => { state.bought.splice(bi, 1); state.list[it.id] = (state.list[it.id] || 0) + b.qty; save(); renderList(); renderStores(); updateTop(); };
      row.appendChild(back); box.appendChild(row);
    });
    body.appendChild(box);
    const sp = document.createElement("div"); sp.className = "spent";
    const tot = state.bought.reduce((a, b) => a + b.price * b.qty, 0);
    sp.innerHTML = `<span>${S.spent}</span><span>${fmt(tot)}</span>`; body.appendChild(sp);
  }
}

function applyI18n() {
  S = STR[lang];
  document.documentElement.lang = lang;
  document.querySelector(".period").textContent = PERIOD[lang];
  document.querySelectorAll(".step").forEach((el, i) => { el.innerHTML = `<span class="n">${i + 1}</span><br>${[S.step1, S.step2, S.step3][i]}`; });
  $("installT").textContent = S.installT; $("installX").textContent = S.installX; $("iosHelp").textContent = S.iosHelp;
  $("installGo").textContent = S.install; $("installNo").textContent = S.later;
  $("search").placeholder = S.search;
  $("mylistLbl").textContent = S.mylist;
  $("closeList").textContent = S.back;
  document.querySelector(".listview h2.title").textContent = S.mylist;
  $("footPeriod").textContent = PERIOD[lang] + " —";
  $("foot1").textContent = S.foot1; $("foot2").textContent = S.foot2;
  $("langBtn").textContent = lang === "fr" ? "EN" : "FR";
  document.querySelectorAll(".kofi").forEach(a => { a.textContent = S.coffee; if (KOFI_URL) { a.href = KOFI_URL; a.classList.add("show"); } });
  renderChips(); renderStores(); renderList(); updateTop();
}

$("search").addEventListener("input", e => { query = e.target.value.trim().toLowerCase(); renderStores(); });
$("langBtn").onclick = () => { lang = lang === "fr" ? "en" : "fr"; localStorage.setItem("zeluvia-lang", lang); applyI18n(); };
$("openList").onclick = () => { document.body.classList.add("inlist"); renderList(); window.scrollTo(0, 0); };
$("closeList").onclick = () => { document.body.classList.remove("inlist"); window.scrollTo(0, 0); };

/* Installation (PWA) */
let deferredPrompt = null;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferredPrompt = e; maybeShowInstall(); });
function isStandalone() { return window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true; }
function maybeShowInstall() {
  if (isStandalone() || localStorage.getItem("zeluvia-install-dismissed")) return;
  const isiOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  if (deferredPrompt) { $("installBox").classList.add("show"); $("installGo").style.display = ""; }
  else if (isiOS) { $("installBox").classList.add("show"); $("iosHelp").style.display = ""; }
}
$("installGo").onclick = async () => { if (!deferredPrompt) return; deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null; $("installBox").classList.remove("show"); };
$("installNo").onclick = () => { localStorage.setItem("zeluvia-install-dismissed", "1"); $("installBox").classList.remove("show"); };
if ("serviceWorker" in navigator) { navigator.serviceWorker.register("sw.js").catch(() => {}); }

applyI18n();
maybeShowInstall();
</script>
</body>
